---
# Role: k3s-agent
# Automated installation of K3s Worker Agent node joining Control Plane via Private VPC IP

- name: Ensure /etc/rancher/k3s directory exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: '0755'

- name: Add Harbor private IP mapping to /etc/hosts for private VPC pull
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ harbor_private_ip }} {{ harbor_hostname }}"
    state: present
  when: harbor_private_ip is defined

- name: Distribute Harbor Root CA to system trust store
  ansible.builtin.copy:
    src: /tmp/harbor_ca.crt
    dest: /usr/local/share/ca-certificates/harbor-ca.crt
    mode: '0644'
  register: harbor_worker_ca

- name: Update system CA certificates on Worker
  ansible.builtin.command: update-ca-certificates
  when: harbor_worker_ca.changed

- name: Copy Harbor Root CA to K3s config directory on Worker
  ansible.builtin.copy:
    src: /tmp/harbor_ca.crt
    dest: /etc/rancher/k3s/harbor-ca.crt
    mode: '0644'

- name: Configure /etc/rancher/k3s/registries.yaml for private Harbor trust
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/registries.yaml
    content: |
      mirrors:
        "{{ harbor_hostname }}":
          endpoint:
            - "https://{{ harbor_hostname }}"
      configs:
        "{{ harbor_hostname }}":
          tls:
            ca_file: "/etc/rancher/k3s/harbor-ca.crt"
    mode: '0644'

- name: Read K3s node join token from control node
  ansible.builtin.slurp:
    src: /tmp/k3s_node_token
  register: local_token_b64
  delegate_to: localhost
  become: false
  no_log: true

- name: Set k3s_node_token fact on worker
  ansible.builtin.set_fact:
    k3s_node_token: "{{ local_token_b64.content | b64decode | trim }}"
  no_log: true

- name: Check if k3s-agent service is already installed
  ansible.builtin.stat:
    path: /etc/systemd/system/k3s-agent.service
  register: k3s_agent_service

- name: Install and join K3s Worker Agent to Server Control Plane
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ k3s_version | default('v1.35.1+k3s1') }}" \
    K3S_URL="https://{{ k3s_server_private_ip }}:6443" \
    K3S_TOKEN="{{ k3s_node_token }}" \
    INSTALL_K3S_EXEC="agent --node-ip {{ worker_private_ip }} --flannel-iface {{ ansible_default_ipv4.interface }}" sh -
  when: not k3s_agent_service.stat.exists
  no_log: true

- name: Ensure k3s-agent service is running and enabled
  ansible.builtin.systemd:
    name: k3s-agent
    state: started
    enabled: yes
