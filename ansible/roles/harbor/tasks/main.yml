---
# Role: harbor
# Automated deployment of Harbor HTTPS Registry on dedicated 60GB EBS mount

- name: Validate that harbor passwords and volume ID are provided
  ansible.builtin.assert:
    that:
      - harbor_admin_password is defined
      - harbor_admin_password | length >= 8
      - harbor_db_password is defined
      - harbor_db_password | length >= 8
      - harbor_admin_password != harbor_db_password
    fail_msg: "harbor_admin_password and distinct harbor_db_password (min 8 characters) must be defined via vault or extra vars."

- name: Validate that harbor_volume_id is provided
  ansible.builtin.assert:
    that:
      - harbor_volume_id is defined
      - harbor_volume_id | length > 0
      - harbor_volume_id is match('^vol-[0-9a-fA-F]+$')
    fail_msg: "harbor_volume_id must be provided matching format 'vol-xxxxxxxxxxxxxxxxx' from Terraform output."
  when: not (ansible_check_mode | default(false))

- name: Safely identify dedicated Harbor EBS volume by Volume ID (AWS identify-nvme-ebs-device)
  ansible.builtin.shell: |
    set -euo pipefail
    TARGET_VOL="{{ harbor_volume_id }}"
    SANITIZED_ID=$(echo "$TARGET_VOL" | tr -d '-')
    MATCHED_DEV=""

    # 1. Search NVMe sysfs serials (/sys/block/nvme*n1/serial)
    for devpath in /sys/block/nvme*n1; do
      if [ -f "$devpath/serial" ]; then
        SERIAL=$(tr -d '[:space:]' < "$devpath/serial")
        if [[ "$SERIAL" == *"$SANITIZED_ID"* ]] || [[ "$SERIAL" == *"$TARGET_VOL"* ]]; then
          DEVNAME=$(basename "$devpath")
          MATCHED_DEV="/dev/$DEVNAME"
          break
        fi
      fi
    done

    # 2. Check /dev/disk/by-id/ symlinks if not yet matched
    if [ -z "$MATCHED_DEV" ] && [ -d /dev/disk/by-id ]; then
      for link in /dev/disk/by-id/*; do
        if [[ "$link" == *"$SANITIZED_ID"* ]] || [[ "$link" == *"$TARGET_VOL"* ]]; then
          REAL_DEV=$(readlink -f "$link")
          if [ -b "$REAL_DEV" ]; then
            MATCHED_DEV="$REAL_DEV"
            break
          fi
        fi
      done
    fi

    # 3. Fail-closed: Strictly require verified Volume ID match (NO unverified fallback)
    if [ -z "$MATCHED_DEV" ] || [ ! -b "$MATCHED_DEV" ]; then
      echo "CRITICAL: Could not find verified EBS block device matching Volume ID $TARGET_VOL. Halting to prevent data loss." >&2
      exit 1
    fi

    # 4. Safety verification: MUST NOT BE ROOT DEVICE
    ROOT_DEV=$(findmnt -n -o SOURCE / || echo "/dev/root")
    if [[ "$ROOT_DEV" == "$MATCHED_DEV"* ]]; then
      echo "CRITICAL: Matched device $MATCHED_DEV is the ROOT disk! Halting immediately." >&2
      exit 1
    fi

    # 5. Safety verification: Volume size check (Expected ~60GB = ~64424509440 bytes)
    DEV_BYTES=$(lsblk -bno SIZE "$MATCHED_DEV" | head -n1)
    if [ "$DEV_BYTES" -lt 58000000000 ] || [ "$DEV_BYTES" -gt 66000000000 ]; then
      echo "CRITICAL: Device $MATCHED_DEV size ($DEV_BYTES bytes) does not match expected 60GB volume! Halting." >&2
      exit 1
    fi

    echo "$MATCHED_DEV"
  args:
    executable: /bin/bash
  register: harbor_ebs_device_raw
  changed_when: false
  when: not (ansible_check_mode | default(false))

- name: Set harbor_data_device fact
  ansible.builtin.set_fact:
    harbor_data_device: "{{ harbor_ebs_device_raw.stdout | trim if (harbor_ebs_device_raw is defined and 'stdout' in harbor_ebs_device_raw and harbor_ebs_device_raw.stdout != '') else '/dev/mock-ebs-check-mode' }}"

- name: Check if dedicated EBS volume is already formatted
  ansible.builtin.command: "blkid {{ harbor_data_device }}"
  register: ebs_blkid
  failed_when: false
  changed_when: false
  when: not (ansible_check_mode | default(false))

- name: Format dedicated EBS volume with ext4 filesystem
  community.general.filesystem:
    fstype: ext4
    dev: "{{ harbor_data_device }}"
  when: not (ansible_check_mode | default(false)) and (ebs_blkid is defined and ebs_blkid.rc | default(0) != 0)

- name: Mount 60GB EBS volume to /data
  ansible.posix.mount:
    path: /data
    src: "{{ harbor_data_device }}"
    fstype: ext4
    state: mounted
  when: not (ansible_check_mode | default(false))

- name: Create Harbor directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - { path: '/data/cert', mode: '0700' }
    - { path: '/data/secret', mode: '0700' }
    - { path: '/opt/harbor', mode: '0755' }

- name: Generate OpenSSL SAN configuration file
  ansible.builtin.copy:
    dest: /data/cert/openssl.cnf
    content: |
      [req]
      default_bits = 4096
      prompt = no
      default_md = sha256
      distinguished_name = dn
      req_extensions = req_ext

      [dn]
      C = VN
      ST = HoChiMinh
      L = ThuDuc
      O = DevOpsLab
      OU = CloudSec
      CN = {{ harbor_hostname }}

      [req_ext]
      subjectAltName = @alt_names

      [alt_names]
      DNS.1 = {{ harbor_hostname }}
      DNS.2 = localhost
      IP.1 = {{ harbor_private_ip | default(ansible_default_ipv4.address) }}
      IP.2 = {{ ansible_host }}
      IP.3 = 127.0.0.1
    mode: '0644'

- name: Check if Harbor CA certificate already exists
  ansible.builtin.stat:
    path: /data/cert/ca.crt
  register: harbor_ca_stat

- name: Generate Self-Signed Root CA
  ansible.builtin.shell: |
    openssl req -x509 -newkey rsa:4096 -days 365 -nodes \
      -keyout /data/cert/ca.key -out /data/cert/ca.crt \
      -subj "/C=VN/ST=HoChiMinh/L=ThuDuc/O=DevOpsLab/CN=Harbor-Internal-Root-CA"
  when: not harbor_ca_stat.stat.exists

- name: Check if Harbor Server certificate already exists
  ansible.builtin.stat:
    path: /data/cert/harbor.crt
  register: harbor_cert_stat

- name: Generate Harbor Server CSR and signed Certificate with SAN
  ansible.builtin.shell: |
    openssl req -new -nodes -newkey rsa:4096 \
      -keyout /data/cert/harbor.key -out /data/cert/harbor.csr \
      -config /data/cert/openssl.cnf
    openssl x509 -req -in /data/cert/harbor.csr \
      -CA /data/cert/ca.crt -CAkey /data/cert/ca.key -CAcreateserial \
      -out /data/cert/harbor.crt -days 365 \
      -extfile /data/cert/openssl.cnf -extensions req_ext
  when: not harbor_cert_stat.stat.exists

- name: Install Harbor Root CA into local system trust store
  ansible.builtin.copy:
    src: /data/cert/ca.crt
    dest: /usr/local/share/ca-certificates/harbor-ca.crt
    remote_src: yes
    mode: '0644'
  register: local_ca_install

- name: Update local CA certificates
  ansible.builtin.command: update-ca-certificates
  when: local_ca_install.changed

- name: Fetch Harbor Root CA to control machine for K3s distribution
  ansible.builtin.fetch:
    src: /data/cert/ca.crt
    dest: /tmp/harbor_ca.crt
    flat: yes

- name: Add local hosts entry for Harbor domain resolution
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "127.0.0.1 {{ harbor_hostname }}"
    state: present

- name: Download Harbor installer tarball (v2.12.2 supported release with sha256 check)
  ansible.builtin.get_url:
    url: https://github.com/goharbor/harbor/releases/download/v2.12.2/harbor-online-installer-v2.12.2.tgz
    dest: /opt/harbor-installer.tgz
    mode: '0644'
    checksum: "sha256:42e20c69edc73e4fb3ad3ccd4071afe449a7a61e5e2ea4021da206f958b5d350"

- name: Extract Harbor installer
  ansible.builtin.unarchive:
    src: /opt/harbor-installer.tgz
    dest: /opt
    remote_src: yes
    creates: /opt/harbor/install.sh

- name: Generate harbor.yml configuration from template
  ansible.builtin.copy:
    dest: /opt/harbor/harbor.yml
    content: |
      hostname: {{ harbor_hostname }}
      http:
        port: 80
      https:
        port: 443
        certificate: /data/cert/harbor.crt
        private_key: /data/cert/harbor.key
      data_volume: /data
      harbor_admin_password: "{{ harbor_admin_password }}"
      database:
        password: "{{ harbor_db_password }}"
      trivy:
        ignore_unfixed: false
        skip_update: false
        offline_scan: false
    mode: '0600'
  no_log: true
  register: harbor_config

- name: Check if Harbor containers are already running
  ansible.builtin.command: docker ps -q -f name=harbor-core
  register: harbor_running
  changed_when: false

- name: Stop Harbor containers if configuration changed
  ansible.builtin.command: docker compose down
  args:
    chdir: /opt/harbor
  when: harbor_config.changed and harbor_running.stdout != ""

- name: Execute Harbor prepare script
  ansible.builtin.command: ./prepare
  args:
    chdir: /opt/harbor
  when: (harbor_running.stdout == "") or harbor_config.changed

- name: Execute Harbor install script with Trivy
  ansible.builtin.command: ./install.sh --with-trivy
  args:
    chdir: /opt/harbor
  when: (harbor_running.stdout == "") or harbor_config.changed

- name: Verify Harbor health API ping endpoint with TLS verification enabled
  ansible.builtin.uri:
    url: "https://{{ harbor_hostname }}/api/v2.0/ping"
    ca_path: /data/cert/ca.crt
    validate_certs: yes
    status_code: 200
  register: harbor_ping
  retries: 12
  delay: 5
  until: harbor_ping.status == 200
